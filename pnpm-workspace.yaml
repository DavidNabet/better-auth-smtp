allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: false

ignoredBuiltDependencies:
  - unrs-resolver

minimumReleaseAge: 10080

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - prisma
  - sharp

trustPolicy: no-downgrade

trustPolicyExclude: chokidar@4.0.3
